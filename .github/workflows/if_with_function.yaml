name: Multiple Branch Demo

on:
  push:
    branches:
      - main
      - develop
      - feature/**

jobs:
  quality_scan:
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'feature/') && github.event_name == 'push'

    steps:
      - name: Code Quality Scan
        run: echo "Scanning code quality using SonarScanner"

  dev_deploy:
    runs-on: ubuntu-latest
    if: github.ref_name == 'develop' && github.event_name == 'push'

    steps:
      - name: Deploy to Development
        run: echo "Deploying application to Development"

  prod_deploy:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' && github.event_name == 'push'

    steps:
      - name: Deploy to Production
        run: echo "Deploying application to Production"

  success_notify:
    runs-on: ubuntu-latest
    needs:
      - quality_scan
      - dev_deploy
      - prod_deploy
    if: always() && !failure()

    steps:
      - name: Success Notification
        run: echo "Deployment successful"

  failure_notify:
    runs-on: ubuntu-latest
    needs:
      - quality_scan
      - dev_deploy
      - prod_deploy
    if: failure()

    steps:
      - name: Failure Notification
        run: echo "Deployment failed"