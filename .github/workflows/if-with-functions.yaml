name: multiple branch demo 
on:
    push:
        branches: 
            - main 
            - develop 
            - feacture/** 
jobs: 
    quality_scan:
        runs-on: ubuntu-latest 
        if: startsWith(github.ref_name, 'feacture') && github.event_name == 'push'
        steps:
            - name: code quality scan using sonarqube 
              run: echo "scanning code quality using sonarscaner"    
    dev_deploy:
        runs-on: ubuntu-latest 
        steps: 
            - name: deploy in dev envirement 
              if: github.event_name == 'develop' && github.event_name == 'push'
              run: echo "Deploy application in dev envoronment" 
    prod_deploy: 
        runs-on: ubuntu-latest 
        if: github.event_name == 'main' && github.event_name == 'push'
        steps: 
            - name: deployed in prod environment 
              run: echo "deploy in prod environment"    
    success_notify:
        runs-on: ubuntu-latest 
        needs: ['quality_scan','dev_deploy','prod_deploy']
        if: always() && !failure()      
        steps: 
            - name: notify success 
              run: echo "successs notify send to team" 
    failure_notify:
        runs-on: ubuntu-latest 
        needs: ['quality_scan','dev_deploy','prod_deploy']
        if: failure()
        steps: 
            - name: failure notigy
              run: echo "failure notify send to team"                                        