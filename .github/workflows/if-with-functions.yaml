# Workflow name displayed in the GitHub Actions tab
name: Multiple Branch Demo

# Trigger the workflow when code is pushed
on:
  push:
    branches:
      - main          # Trigger on pushes to the main branch
      - develop       # Trigger on pushes to the develop branch
      - feature/**    # Trigger on pushes to any feature branch (feature/login, feature/api, etc.)

jobs:

  # ------------------------------------------------------------------
  # Run code quality scan only for feature branches
  # ------------------------------------------------------------------
  quality_scan:
    runs-on: ubuntu-latest

    # ERROR FIX:
    # You wrote:
    # startsWith(github.ref_name, 'feacture')
    #
    # Problems:
    # 1. "feacture" is misspelled.
    # 2. Branch pattern should match "feature/".
    if: startsWith(github.ref_name, 'feature/') && github.event_name == 'push'

    steps:
      - name: Code Quality Scan using SonarQube
        run: echo "Scanning code quality using SonarScanner"


  # ------------------------------------------------------------------
  # Deploy to Development Environment
  # ------------------------------------------------------------------
  dev_deploy:
    runs-on: ubuntu-latest

    # ERROR FIX:
    # You wrote:
    # github.event_name == 'develop'
    #
    # github.event_name can only be:
    # push
    # pull_request
    # workflow_dispatch
    #
    # It NEVER contains the branch name.
    #
    # Branch name is stored in github.ref_name.
    if: github.ref_name == 'develop' && github.event_name == 'push'

    steps:
      - name: Deploy in Development Environment
        run: echo "Deploying application in Development Environment"


  # ------------------------------------------------------------------
  # Deploy to Production Environment
  # ------------------------------------------------------------------
  prod_deploy:
    runs-on: ubuntu-latest

    # ERROR FIX:
    # You wrote:
    # github.event_name == 'main'
    #
    # "main" is a branch name, not an event.
    if: github.ref_name == 'main' && github.event_name == 'push'

    steps:
      - name: Deploy in Production Environment
        run: echo "Deploying application in Production Environment"


  # ------------------------------------------------------------------
  # Send Success Notification
  # ------------------------------------------------------------------
  success_notify:
    runs-on: ubuntu-latest

    needs:
      - quality_scan
      - dev_deploy
      - prod_deploy

    # Run if all required jobs completed successfully
    if: always() && !failure()

    steps:
      - name: Success Notification
        run: echo "Deployment completed successfully."


  # ------------------------------------------------------------------
  # Send Failure Notification
  # ------------------------------------------------------------------
  failure_notify:
    runs-on: ubuntu-latest

    needs:
      - quality_scan
      - dev_deploy
      - prod_deploy

    # Run only if one of the dependent jobs failed
    if: failure()

    steps:
      - name: Failure Notification
        run: echo "Deployment failed."